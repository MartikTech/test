<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GitFeed</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body>

<nav class="nav">
  <div class="brand">
    <svg width="20" height="20" viewBox="0 0 16 16" fill="currentColor"><path fill-rule="evenodd" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
    GitFeed
  </div>
  <input class="nav-search" placeholder="Search repositories..." id="searchInput" />
  <button class="filter-toggle" id="filterToggle" title="Filters">
    <svg width="15" height="15" viewBox="0 0 16 16" fill="currentColor"><path d="M6 10.5a.5.5 0 0 1 .5-.5h3a.5.5 0 0 1 0 1h-3a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h7a.5.5 0 0 1 0 1h-7a.5.5 0 0 1-.5-.5zm-2-3a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 0 1h-11a.5.5 0 0 1-.5-.5z"/></svg>
    Filters
    <span class="filter-badge" id="filterBadge" style="display:none">0</span>
  </button>
  <div class="nav-auth" id="authArea"></div>
</nav>

<div class="filter-panel" id="filterPanel">
  <div class="filter-panel-inner">

    <div class="fp-section">
      <div class="fp-label">Sort by</div>
      <div class="fp-row">
        <button class="fp-sort active" data-sort="stars">★ Stars</button>
        <button class="fp-sort" data-sort="forks">⑂ Forks</button>
        <button class="fp-sort" data-sort="updated">↻ Updated</button>
        <button class="fp-sort" data-sort="help-wanted-issues">🙋 Help Wanted</button>
      </div>
    </div>

    <div class="fp-section">
      <div class="fp-label">Stars range</div>
      <div class="fp-row" id="starsPresets">
        <button class="fp-sort active" data-stars="">Any</button>
        <button class="fp-sort" data-stars="100">100+</button>
        <button class="fp-sort" data-stars="1000">1k+</button>
        <button class="fp-sort" data-stars="5000">5k+</button>
        <button class="fp-sort" data-stars="10000">10k+</button>
        <button class="fp-sort" data-stars="50000">50k+</button>
        <button class="fp-sort" data-stars="100000">100k+</button>
      </div>
      <div class="fp-range-row">
        <input class="fp-input" type="number" id="starsMin" placeholder="Min stars" min="0" />
        <span class="fp-range-sep">–</span>
        <input class="fp-input" type="number" id="starsMax" placeholder="Max stars" min="0" />
      </div>
    </div>

    <div class="fp-section">
      <div class="fp-label">Language</div>
      <div class="fp-chips" id="langChips"></div>
    </div>

    <div class="fp-section">
      <div class="fp-label">Topic</div>
      <div class="fp-chips" id="topicChips"></div>
    </div>

    <div class="fp-section">
      <div class="fp-label">More filters</div>
      <div class="fp-row fp-toggles">
        <label class="fp-toggle"><input type="checkbox" id="filterArchived" /> Archived repos</label>
        <label class="fp-toggle"><input type="checkbox" id="filterForks" /> Include forks</label>
        <label class="fp-toggle"><input type="checkbox" id="filterGoodFirst" /> Good first issues</label>
        <label class="fp-toggle"><input type="checkbox" id="filterMirror" /> Mirrors only</label>
      </div>
    </div>

    <div class="fp-section">
      <div class="fp-label">Created after</div>
      <input class="fp-input" type="date" id="filterCreatedAfter" style="max-width:180px" />
    </div>

    <div class="fp-section">
      <div class="fp-label">Exclude languages</div>
      <div class="fp-exclude-row">
        <input class="fp-input" id="excludeLangInput" placeholder="e.g. PHP, Java" />
        <div class="fp-chips" id="excludeLangChips"></div>
      </div>
    </div>

    <div class="fp-section">
      <div class="fp-label">Exclude topics / keywords</div>
      <div class="fp-exclude-row">
        <input class="fp-input" id="excludeTopicInput" placeholder="e.g. tutorial, beginner" />
        <div class="fp-chips" id="excludeTopicChips"></div>
      </div>
    </div>

    <div class="fp-footer">
      <span class="fp-count" id="fpCount"></span>
      <button class="fp-clear" id="fpClear">Clear all</button>
    </div>

  </div>
</div>

<div class="page">
  <div id="feed"><div class="loading">Loading...</div></div>
  <div class="sentinel" id="sentinel"></div>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle">README</span>
      <button class="modal-close" id="modalClose">✕</button>
    </div>
    <div class="modal-body" id="modalBody"><div class="modal-loading">Loading README...</div></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="app.js"></script>
</body>
</html>
